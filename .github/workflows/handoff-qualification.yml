name: Blog handoff qualification

on:
  push:
    branches: [test/blog-handoffs-20261013]

permissions:
  contents: read

jobs:
  browser-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Set tooling paths
        run: |
          echo "COREPACK_HOME=$RUNNER_TEMP/corepack" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/browsers" >> "$GITHUB_ENV"
      - name: Select Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = '1.22.22'
      - name: Install pinned isolated browser tooling without changing the application
        run: |
          mkdir -p "$RUNNER_TEMP/browser-tools"
          printf '{"private":true}\n' > "$RUNNER_TEMP/browser-tools/package.json"
          yarn --cwd "$RUNNER_TEMP/browser-tools" add --exact --non-interactive playwright@1.57.0
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install chromium --only-shell
          tar -czf "$RUNNER_TEMP/browser-tooling.tar.gz" -C "$RUNNER_TEMP" browser-tools browsers corepack
      - name: Retain only public test-tooling packages and binaries
        uses: actions/upload-artifact@v4
        with:
          name: blog-browser-tooling-${{ github.sha }}
          path: ${{ runner.temp }}/browser-tooling.tar.gz
          if-no-files-found: error
          retention-days: 7
