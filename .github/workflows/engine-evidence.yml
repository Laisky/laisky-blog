name: Blog engine evidence inputs

on:
  push:
    branches: [test/blog-199-engine-evidence-20261013]
    paths: [.github/workflows/engine-evidence.yml]

permissions:
  contents: read
  actions: read

jobs:
  target-control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Recover the already-qualified baseline and locked dependencies
        uses: actions/download-artifact@v4
        with:
          name: blog-baseline-fcd9ab5393354788d3e6fd4547345a23084256be
          run-id: 38345246620
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Recover the verified target browser input
        uses: actions/download-artifact@v4
        with:
          name: blog-target-control-4a8d89aadcebc79a529cde9d7918b6096a673b94
          run-id: 38408140861
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/target
      - name: Recover the completed public byte capture without new production requests
        uses: actions/download-artifact@v4
        with:
          name: blog-public-capture-c03df633cd3a142dc8241371356dc7181d92321f
          run-id: 38406818429
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/public
      - name: Restore exact inputs and select pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/baseline/_temp/blog-qualification/yarn-lock.sha256"
          tar -xzf "$RUNNER_TEMP/baseline/_temp/blog-qualification/dependencies.tar.gz"
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = '1.22.22'
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import zipfile
          root = Path(os.environ['RUNNER_TEMP']) / 'target'
          metadata = json.loads((root / 'browser-input.json').read_text())
          source = root / 'chromium-1045629.zip'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == metadata['sha256'] == '818abf04a7db318659a8297e3aa2d6de48529f258cf0ac47678179053eba4e1e'
          with zipfile.ZipFile(source) as archive:
              for entry in archive.infolist():
                  destination = (root / entry.filename).resolve()
                  assert root.resolve() in destination.parents
                  mode = (entry.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  archive.extract(entry, root)
                  if mode & 0o777:
                      destination.chmod(mode & 0o777)
          PY
          python3 -m venv "$RUNNER_TEMP/browser-env"
          "$RUNNER_TEMP/browser-env/bin/pip" install --disable-pip-version-check playwright==1.57.0
      - name: Rebuild and require byte identity with the deployed script
        shell: bash
        run: |
          set -euo pipefail
          yarn build
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          current = Path('dist/assets/index-Bkwg43V1.js').read_bytes()
          assert current == (temp / 'public/index-Bkwg43V1.js').read_bytes()
          assert hashlib.sha256(current).hexdigest() == '14a7a0c0e583c8ffab3633d37f67c4bb698e93aeee9bd151ec030fc4d355ba56'
          baseline = temp / 'baseline/laisky-blog/laisky-blog/dist/assets/index-C4Ql5MCr.js'
          assert hashlib.sha256(baseline.read_bytes()).hexdigest() == 'e70691b88f42ad59e1e4e5fb15e4c854943f1cd435f93d5c7fb20c3b129e0d50'
          PY
      - name: Run actual Chrome 107 against offline modules and both exact app bundles
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/browser-env/bin/python" .scripts/qualify_historical_engines.py \
            --browser "$RUNNER_TEMP/target/chrome-linux/chrome" --major 107 \
            --baseline "$RUNNER_TEMP/baseline/laisky-blog/laisky-blog/dist" \
            --candidate dist --public-html "$RUNNER_TEMP/public/list.html" \
            --report "$RUNNER_TEMP/engine-results/chromium107.json"
      - name: Retain only the sanitized engine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-target-results-${{ github.sha }}
          path: ${{ runner.temp }}/engine-results
          if-no-files-found: error
          retention-days: 7
