name: Blog engine evidence inputs

on:
  push:
    branches: [test/blog-199-engine-evidence-20261013]
    paths: [.github/workflows/engine-evidence.yml]

permissions:
  contents: read

jobs:
  target-control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download the official target engine without executing it
        shell: bash
        run: |
          set -euo pipefail
          export INPUTS="$RUNNER_TEMP/target-control"
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request
          root = Path(os.environ['INPUTS'])
          root.mkdir()
          url = 'https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/1045629/chrome-linux.zip'
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(url, timeout=60) as response, (root / 'chromium-1045629.zip').open('wb') as output:
              while data := response.read(1024 * 1024):
                  size += len(data)
                  if size > 300 * 1024 * 1024:
                      raise RuntimeError('Snapshot exceeds expected size bound')
                  digest.update(data)
                  output.write(data)
          (root / 'browser-input.json').write_text(json.dumps({'captured_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'revision': '1045629', 'expected_major': 107, 'sha256': digest.hexdigest(), 'size': size, 'source': url}, indent=2) + '\n')
          PY
      - name: Retain public target control only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-target-control-${{ github.sha }}
          path: ${{ runner.temp }}/target-control
          if-no-files-found: error
          retention-days: 7
