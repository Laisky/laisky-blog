version: 2.1

jobs:
  fast-ci:
    docker:
      - image: cimg/node:22.22.3@sha256:839b2f09a95b90c6f3cee344bfbb3e3fda8c26d12ede6d7f76666cacf86486dc
    resource_class: small
    environment:
      CI: 'true'
      FAST_CI_EVIDENCE: /tmp/blog-fast-ci
      YARN_CACHE_FOLDER: /tmp/blog-yarn-cache
    steps:
      - checkout:
          method: full
      - restore_cache:
          keys:
            - blog-fast-yarn-node22-v1-{{ checksum "yarn.lock" }}
      - run:
          name: Verify the toolchain and fast-gate failure controls
          command: |
            set -euo pipefail
            test "$(node --version)" = 'v22.22.3'
            test "$(yarn --version)" = '1.22.22'
            node --test .scripts/test_fast_ci.mjs .scripts/test_circleci_base.mjs
            python3 -m unittest discover -s .scripts -p test_deploy_blog.py -v
      - run:
          name: Frozen setup, changed-file formatting and nine essential units
          no_output_timeout: 5m
          command: |
            set -euo pipefail
            git fetch --quiet --no-tags origin +refs/heads/v2:refs/remotes/origin/v2
            BASE_SHA="$(node .scripts/circleci_base.mjs)"
            FAST_CI_BASE="$BASE_SHA" timeout 300s node .scripts/fast_ci.mjs
      - save_cache:
          key: blog-fast-yarn-node22-v1-{{ checksum "yarn.lock" }}
          paths:
            - /tmp/blog-yarn-cache
      - store_artifacts:
          path: /tmp/blog-fast-ci
          destination: fast-ci

workflows:
  fast-ci:
    jobs:
      - fast-ci:
          filters:
            tags:
              ignore: /.*/
