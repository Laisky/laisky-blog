server {
    listen 80;

    gzip on;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_vary on;

    root /app;
    index index.html;
    include /etc/nginx/mime.types;

    add_header Link '<https://blog.laisky.com/llms.txt>; rel="llms-txt"; type="text/plain"' always;
    add_header Link '<https://blog.laisky.com/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json"' always;
    add_header Link '<https://blog.laisky.com/.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
    add_header Link '<https://blog.laisky.com/.well-known/agent-skills/index.json>; rel="agent-skills"; type="application/json"' always;
    add_header Link '<https://blog.laisky.com/.well-known/mcp/server-card.json>; rel="mcp-server-card"; type="application/json"' always;

    location = /pages/0/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Link '<https://blog.laisky.com/llms.txt>; rel="llms-txt"; type="text/plain"' always;
        add_header Link '<https://blog.laisky.com/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/agent-skills/index.json>; rel="agent-skills"; type="application/json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/mcp/server-card.json>; rel="mcp-server-card"; type="application/json"' always;
        add_header Vary "Accept" always;
        if ($arg_mode = "agent") {
            rewrite ^ /agent.md last;
        }
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        expires max;
        add_header Cache-Control "public, immutable, no-transform";
        try_files $uri =404;
    }

    location = / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Link '<https://blog.laisky.com/llms.txt>; rel="llms-txt"; type="text/plain"' always;
        add_header Link '<https://blog.laisky.com/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/agent-skills/index.json>; rel="agent-skills"; type="application/json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/mcp/server-card.json>; rel="mcp-server-card"; type="application/json"' always;
        add_header Vary "Accept" always;
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location ~ \.(md|markdown)$ {
        default_type text/markdown;
        add_header Link '<https://blog.laisky.com/llms.txt>; rel="llms-txt"; type="text/plain"' always;
        add_header Link '<https://blog.laisky.com/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/agent-skills/index.json>; rel="agent-skills"; type="application/json"' always;
        add_header Link '<https://blog.laisky.com/.well-known/mcp/server-card.json>; rel="mcp-server-card"; type="application/json"' always;
        add_header Vary "Accept" always;
        try_files $uri =404;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
    }

    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/oauth-authorization-server {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/http-message-signatures-directory {
        default_type application/http-message-signatures-directory+json;
        try_files $uri =404;
    }

    location = /api {
        default_type application/json;
        add_header RateLimit-Limit "120" always;
        add_header RateLimit-Remaining "119" always;
        add_header RateLimit-Reset "60" always;
        add_header Idempotency-Key "optional-for-read-only-requests" always;
        try_files $uri =404;
    }

    location = /api/llms.txt {
        default_type text/plain;
        add_header Vary "Accept" always;
        try_files /llms-api.txt =404;
    }

    location ^~ /api/ {
        default_type application/json;
        add_header RateLimit-Limit "120" always;
        add_header RateLimit-Remaining "119" always;
        add_header RateLimit-Reset "60" always;
        return 404 '{"code":"not_found","message":"No such API endpoint","recovery":"Use /api, /openapi.json, or /v1/resources.","status":404}';
    }

    location ^~ /v1/ {
        default_type application/json;
        add_header RateLimit-Limit "120" always;
        add_header RateLimit-Remaining "119" always;
        add_header RateLimit-Reset "60" always;
        add_header Deprecation "false" always;
        add_header Sunset "Fri, 31 Dec 2027 23:59:59 GMT" always;
        add_header Link '<https://blog.laisky.com/deprecation.md>; rel="deprecation"; type="text/markdown"' always;
        add_header Idempotency-Key "optional-for-read-only-requests" always;
        try_files $uri @json_not_found;
    }

    location = /ask {
        default_type application/json;
        error_page 418 = @ask_stream;
        add_header RateLimit-Limit "120" always;
        add_header RateLimit-Remaining "119" always;
        add_header RateLimit-Reset "60" always;
        if ($arg_stream = "true") {
            return 418;
        }
        if ($http_accept ~* "text/event-stream") {
            return 418;
        }
        if ($request_method = POST) {
            return 200 '{"_meta":{"protocol":"nlweb","version":"2026-07-03","stream":"https://blog.laisky.com/ask?stream=true","openapi":"https://blog.laisky.com/openapi.json"},"answer":"Laisky Blog public resources are documented at /llms.txt, /index.md, /openapi.json, and /.well-known/mcp/server-card.json.","citations":["https://blog.laisky.com/llms.txt","https://blog.laisky.com/openapi.json"]}';
        }
        try_files $uri @json_not_found;
    }

    location @ask_stream {
        default_type text/event-stream;
        add_header Cache-Control "no-store" always;
        add_header RateLimit-Limit "120" always;
        add_header RateLimit-Remaining "119" always;
        add_header RateLimit-Reset "60" always;
        return 200 'event: answer\ndata: {"_meta":{"protocol":"nlweb","version":"2026-07-03","openapi":"https://blog.laisky.com/openapi.json"},"answer":"Laisky Blog public resources are documented at /llms.txt, /index.md, /openapi.json, and /.well-known/mcp/server-card.json.","citations":["https://blog.laisky.com/llms.txt","https://blog.laisky.com/openapi.json"]}\n\n';
    }

    location @json_not_found {
        default_type application/json;
        add_header RateLimit-Limit "120" always;
        add_header RateLimit-Remaining "119" always;
        add_header RateLimit-Reset "60" always;
        return 404 '{"code":"not_found","message":"No public resource exists at this path.","recovery":"Use /api, /openapi.json, /llms.txt, or /v1/resources.","status":404}';
    }

    location = /ask-stream {
        default_type text/event-stream;
        add_header RateLimit-Limit "120" always;
        add_header RateLimit-Remaining "119" always;
        add_header RateLimit-Reset "60" always;
        try_files $uri =404;
    }

    location = /.well-known/webmcp {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/nlweb.json {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/nlweb {
        default_type application/json;
        try_files $uri =404;
    }

    location ~ ^/(developers|pricing|sandbox)$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
